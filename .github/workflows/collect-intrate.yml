# helpmeyogurt.github.io repo의 .github/workflows/collect-intrate.yml 로 복사할 것.
# 예금·적금·대출 공시 금리 → intrate/rates.json. 커밋 메시지는 무브랜드 정책.
# 공시는 월 단위 갱신이지만 반영 시점이 불규칙해 매일 확인.
name: collect-intrate

on:
  schedule:
    - cron: '45 20 * * *'   # KST 05:45
    - cron: '45 1 * * *'    # KST 10:45 (캐치업)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-intrate
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect rates
        env:
          FINLIFE_KEY: ${{ secrets.FINLIFE_KEY }}
        run: |
          for i in 1 2 3; do
            node tools/collect_intrate_rates.js intrate/rates.json && exit 0
            echo "attempt $i failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Commit & push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add intrate/rates.json
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m "intrate: 금리 갱신 $(TZ=Asia/Seoul date +%m-%d)"
          git push origin main \
            || { git fetch origin && git rebase origin/main && git push origin main; }
